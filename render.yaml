# Blueprint do Render: backend (Docker) + banco PostgreSQL.
# No painel do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: educonnect-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: educonnect-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: educonnect-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: educonnect-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: educonnect-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: educonnect-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_LOGIN
        value: admin
      # Preenchidos no painel durante a criação do Blueprint:
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: educonnect-db
    plan: free
    databaseName: educonnect
    user: educonnect
