# Blueprint do Render: backend (Docker). O banco PostgreSQL fica no Supabase.
# No painel do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: educonnect-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Banco no Supabase (Session pooler, compatível com IPv4). Exemplo de DB_URL:
      # jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        value: postgres.tdhtsydbrzjtzemewube
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_LOGIN
        value: admin
      # Perfil demo: cria dados de exemplo; a tela de login mostra as contas
      # admin, ana.lima e carla.souza com esta senha. Site público de demonstração.
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: DEMO_PASSWORD
        value: demo1234
      - key: ADMIN_PASSWORD
        value: demo1234
      # Preenchidos no painel durante a criação do Blueprint:
      - key: DB_URL
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
