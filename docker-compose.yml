# Banco PostgreSQL para desenvolvimento local.
# Uso: docker compose --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: educonnect
      POSTGRES_USER: ${DB_USERNAME:-educonnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - educonnect-dados:/var/lib/postgresql/data

volumes:
  educonnect-dados:
