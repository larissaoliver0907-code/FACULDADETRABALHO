spring:
  datasource:
    url: jdbc:h2:mem:educonnect_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

educonnect:
  security:
    jwt-secret: segredo-apenas-para-testes-automatizados-0123456789
    jwt-expiration-minutes: 30
  cors:
    allowed-origins: http://localhost:5173
  bootstrap:
    admin-login: ""
    admin-password: ""
