spring:
  application:
    name: educonnect
  config:
    # Lê variáveis de um arquivo .env (raiz do projeto ou pasta backend), se existir.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educonnect}
    username: ${DB_USERNAME:educonnect}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

educonnect:
  security:
    # Segredo do JWT: obrigatório, no mínimo 32 caracteres. Nunca versionar o valor real.
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    # Lista separada por vírgula com as origens permitidas.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    # Cria o primeiro administrador quando o banco não possui usuários.
    admin-login: ${ADMIN_LOGIN:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-nome: ${ADMIN_NOME:Administrador}

logging:
  level:
    root: INFO
    com.educonnect: INFO
